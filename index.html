<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Utazásaink">
<title>Utazásaink</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon512.png">
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1c232d;--line:#2a3340;--txt:#e6edf3;--mut:#8b98a8;--acc:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:rgba(13,17,23,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12px;color:var(--mut);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.ib{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;width:40px;height:40px;font-size:18px;display:grid;place-items:center;flex:none;padding:0}
main{padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 3px;font-size:16px;word-break:break-word}
.card.today{border-color:var(--acc)}
.meta{color:var(--mut);font-size:13px;word-break:break-word}
.note{font-size:14px;color:#c9d4df;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.row{display:flex;align-items:center;gap:10px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut);flex:none;white-space:nowrap}
.chip.g{color:#7dd3fc;border-color:#164e63}
.chip.r{color:#f9a8d4;border-color:#831843}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 2px 8px;font-weight:600}
.sec:first-child{margin-top:4px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(22,27,34,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 7px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button span{font-size:20px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--acc)}
nav button.on span{filter:none;opacity:1}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--acc);color:#04111a;border:0;font-size:32px;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.55);z-index:11}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--bg);flex:none;display:grid;place-items:center;font-size:16px;color:transparent;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:#04111a}
.done h3{text-decoration:line-through;color:var(--mut)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:30px;font-weight:700;letter-spacing:.14em;background:var(--bg);border:1px dashed var(--warn);color:var(--warn);border-radius:12px;padding:12px;text-align:center;margin:12px 0 4px;word-break:break-all}
.code small{display:block;font-size:11px;letter-spacing:0;font-weight:400;color:var(--mut);font-family:-apple-system,system-ui,sans-serif;margin-top:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin-top:10px}
.kv b{color:var(--mut);font-weight:500}
.kv span{word-break:break-word}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.a{flex:1;min-width:120px;text-align:center;text-decoration:none;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-size:14px;font-family:inherit}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:none;align-items:flex-end}
#sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.panel h2{margin:0 0 4px;font-size:19px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font-size:16px;font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=date],input[type=time],input[type=datetime-local]{min-height:48px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.sw{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:15px;color:var(--txt)}
.sw input{width:26px;height:26px;-webkit-appearance:checkbox;appearance:checkbox;accent-color:var(--ok);flex:none}
.stars button{background:none;border:0;font-size:34px;color:var(--line);padding:0 4px}
.stars button.on{color:var(--warn)}
.btns{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px;font-weight:600;font-family:inherit}
.btn.p{background:var(--acc);color:#04111a;border-color:var(--acc)}
.btn.d{color:var(--bad);border-color:#7f1d1d;flex:0 0 auto;padding:14px 16px}
.btn:disabled{opacity:.6}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:#0b2a3a;border:1px solid var(--acc);color:var(--txt);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.empty{text-align:center;color:var(--mut);padding:40px 20px;line-height:1.6}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;text-align:center;max-width:420px;margin:0 auto}
.login h1{margin:8px 0 2px}
.login form{margin-top:28px}
.prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.sync{color:var(--warn)}
.time{font-weight:700;color:var(--acc);min-width:48px;font-variant-numeric:tabular-nums}
.stars-s{color:var(--warn);margin-top:6px;letter-spacing:2px}
.stars-s span{color:var(--line)}
.quick{display:flex;gap:8px;margin-bottom:10px}
.quick input{flex:1}
.quick select{width:105px;flex:none}
.cd{display:flex;gap:8px;margin:0 0 14px}
.cd div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.cd b{display:block;font-size:28px;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.1}
.cd span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.cdline{color:var(--acc);font-size:13px;margin-top:6px;font-weight:600}
.banner{background:var(--card);border:1px solid var(--acc);color:var(--acc);border-radius:12px;padding:10px;text-align:center;font-weight:600;margin-bottom:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.thumbs .th{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.th .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;font-size:14px;padding:0}
label.upbtn{display:block;text-align:center;padding:14px;border:1px dashed var(--acc);color:var(--acc);border-radius:12px;margin:10px 0 4px;font-size:15px}
#viewer{position:fixed;inset:0;background:#000;z-index:40;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#viewer.open{display:block}
#viewer img{width:100%;display:block;margin-bottom:10px;background:#fff;min-height:120px}
#viewer .vx{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;width:46px;height:46px;border-radius:50%;background:rgba(50,50,50,.9);color:#fff;border:0;font-size:20px;z-index:41}
#viewer .vt{color:#fff;padding:calc(20px + env(safe-area-inset-top)) 70px 14px 16px;font-weight:600;font-size:17px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" onclick="if(event.target.id==='sheet')closeSheet()"><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<div id="viewer"></div>

<script>
/* ===== BEÁLLÍTÁS: ide másold be az Apps Script webalkalmazás URL-jét ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycby4dLibVnmzHDfwb40Bf_IqJKU7P5bgRMQMjBzvYXFyUAFlCTL5tdKGQ7-zngD58J_27Q/exec';

/* ===== Adatszerkezet ===== */
const TABS = [
  {k:'stay',  ic:'🏠', l:'Szállás'},
  {k:'docs',  ic:'🎫', l:'Jegyek'},
  {k:'plan',  ic:'🗓️', l:'Program'},
  {k:'sight', ic:'📸', l:'Látnivaló'},
  {k:'food',  ic:'🍽️', l:'Vacsora'},
  {k:'spot',  ic:'📍', l:'Helyek'},
  {k:'pack',  ic:'🧳', l:'Pakolás'}
];
const TITLES = {trip:'utazás',stay:'szállás',plan:'program',sight:'látnivaló',food:'étterem',spot:'hely',pack:'tétel',docs:'jegy / beszállókártya'};
const F = {
  trip:[{k:'name',l:'Utazás neve',t:'text',req:1,ph:'pl. Tenerife 2026'},{k:'place',l:'Helyszín',t:'text',ph:'pl. Tenerife'},{k:'from',l:'Indulás',t:'date'},{k:'time',l:'Indulás időpontja (a visszaszámlálóhoz)',t:'time'},{k:'to',l:'Hazaérkezés',t:'date'},{k:'note',l:'Megjegyzés (járat, autóbérlés...)',t:'area'}],
  stay:[{k:'name',l:'Szállás neve',t:'text',req:1,ph:'pl. Airbnb Los Cristianos'},{k:'address',l:'Cím (vagy Google Maps link)',t:'text'},{k:'code',l:'Belépési kód',t:'text'},{k:'wifi',l:'Wifi (név / jelszó)',t:'text'},{k:'checkin',l:'Bejelentkezés',t:'datetime-local'},{k:'checkout',l:'Kijelentkezés',t:'datetime-local'},{k:'host',l:'Szállásadó / telefon',t:'text'},{k:'link',l:'Foglalás linkje (Airbnb, Booking)',t:'text'},{k:'note',l:'Megjegyzés (parkolás, kulcs...)',t:'area'}],
  plan:[{k:'date',l:'Nap',t:'day',req:1},{k:'time',l:'Időpont (üresen hagyható)',t:'time'},{k:'title',l:'Mit csinálunk',t:'text',req:1,ph:'pl. Teide felvonó'},{k:'address',l:'Hol (cím, hely neve vagy Maps link)',t:'text'},{k:'note',l:'Megjegyzés',t:'area'}],
  sight:[{k:'title',l:'Látnivaló',t:'text',req:1},{k:'address',l:'Hol (cím, hely neve vagy Maps link)',t:'text'},{k:'date',l:'Tervezett nap',t:'day'},{k:'note',l:'Megjegyzés',t:'area'},{k:'done',l:'Megvolt ✓',t:'check'}],
  food:[{k:'title',l:'Étterem',t:'text',req:1},{k:'address',l:'Hol (cím, hely neve vagy Maps link)',t:'text'},{k:'date',l:'Tervezett nap',t:'day'},{k:'note',l:'Megjegyzés (mit érdemes enni, foglalás...)',t:'area'},{k:'done',l:'Voltunk itt ✓',t:'check'},{k:'rating',l:'Értékelés',t:'rating'}],
  spot:[{k:'title',l:'Hely neve',t:'text',req:1},{k:'cat',l:'Típus',t:'select',o:['Strand','Kávézó','Étterem','Bár','Bolt','Kilátó','Túra','Egyéb']},{k:'address',l:'Hol (cím, hely neve vagy Maps link)',t:'text'},{k:'note',l:'Megjegyzés',t:'area'}],
  docs:[{k:'title',l:'Megnevezés',t:'text',req:1,ph:'pl. Oda – FR 1234, Gábor'},{k:'who',l:'Kié',t:'select',o:['Közös','Gábor','Réka']},{k:'date',l:'Nap',t:'day'},{k:'time',l:'Indulás ideje',t:'time'},{k:'files',l:'Beszállókártya / jegy (kép vagy PDF)',t:'files'},{k:'note',l:'Megjegyzés (kapu, ülés, poggyász...)',t:'area'}],
  pack:[{k:'title',l:'Tétel',t:'text',req:1},{k:'who',l:'Kié',t:'select',o:['Közös','Gábor','Réka']},{k:'done',l:'Bepakolva ✓',t:'check'}]
};

/* ===== Állapot ===== */
const LS = 'utazasaink_v1';
let S = {code:'',user:'',items:[],queue:[],trip:null,tab:'plan',loading:false};
try { Object.assign(S, JSON.parse(localStorage.getItem(LS) || '{}')); } catch(e) {}
S.loading = false;
let QW = 'Közös', FORM = null, flushing = false;

function persist(){ try{ localStorage.setItem(LS, JSON.stringify({code:S.code,user:S.user,items:S.items,queue:S.queue,trip:S.trip,tab:S.tab})); }catch(e){} }

/* ===== Segédek ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const nowIso = () => new Date().toISOString();
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2400); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return ymd(new Date()); }
function tripDays(t){ if(!t||!t.from||!t.to) return []; const out=[], d=new Date(t.from+'T00:00'), end=new Date(t.to+'T00:00'); if(isNaN(d)||isNaN(end)) return []; while(d<=end && out.length<120){ out.push(ymd(d)); d.setDate(d.getDate()+1); } return out; }
const clearBtn = id => `<button type="button" class="ib" style="height:48px;width:48px" title="Törlés" onclick="$('${id}').value=''">✕</button>`;
function fd(s){ if(!s) return ''; const d=new Date(s+'T00:00'); if(isNaN(d)) return esc(s); return d.toLocaleDateString('hu-HU',{month:'short',day:'numeric',weekday:'long'}); }
function fdt(s){ if(!s) return ''; const d=new Date(s); if(isNaN(d)) return s; return d.toLocaleString('hu-HU',{month:'short',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'}); }
function range(a,b){ const f=s=>{const d=new Date(s+'T00:00'); return isNaN(d)?s:d.toLocaleDateString('hu-HU',{year:'numeric',month:'short',day:'numeric'});}; if(a&&b) return f(a)+' – '+f(b); return a?f(a):''; }
function defDate(t){ const td=todayStr(); if(t&&t.from&&t.to&&td>=t.from&&td<=t.to) return td; return (t&&t.from)||td; }
function safeUrl(u){ u=String(u||'').trim(); return /^https?:\/\//i.test(u) ? u : 'https://'+u; }
function mapUrl(a,t){ if(/^https?:\/\//i.test(a)) return a; const q=(a.indexOf(',')<0 && t && t.place) ? a+', '+t.place : a; return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q); }
const who = a => a ? `<span class="chip ${a==='Réka'?'r':'g'}">${esc(a)}</span>` : '';
const kv = (k,v) => v ? `<b>${k}</b><span>${esc(v)}</span>` : '';
const empty = t => `<div class="empty">${t}</div>`;
const noteH = i => i.note ? `<div class="note">${esc(i.note)}</div>` : '';
const mapA = (addr,t) => addr ? `<a class="a" href="${esc(mapUrl(addr,t))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🧭 Térkép</a>` : '';
const actsH = (addr,t) => addr ? `<div class="acts">${mapA(addr,t)}</div>` : '';
const addrTxt = a => /^https?:\/\//i.test(a||'') ? 'Térkép link' : (a||'');

/* ===== Visszaszámláló ===== */
function addM(date,n){ const x=new Date(date), day=x.getDate(); x.setMonth(x.getMonth()+n); if(x.getDate()<day) x.setDate(0); return x; }
function tripTarget(t){ if(!t||!t.from) return null; const d=new Date(t.from+'T'+(t.time||'00:00')); return isNaN(d)?null:d; }
function cd(target){
  const now=new Date(); if(!target||target<=now) return null;
  let m=0; while(addM(now,m+1)<=target) m++;
  let ms=target-addM(now,m);
  const d=Math.floor(ms/864e5); ms-=d*864e5;
  const hh=Math.floor(ms/36e5); ms-=hh*36e5;
  return {m,d,h:hh,mi:Math.floor(ms/6e4)};
}
function cdRender(target,mode){
  const p=cd(target); if(!p) return '';
  if(mode==='line') return '⏳ még '+(p.m?p.m+' hónap ':'')+p.d+' nap '+p.h+' óra';
  return [['Hónap',p.m],['Nap',p.d],['Óra',p.h],['Perc',p.mi]].map(([l,v])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');
}
function tripBanner(t){
  const tg=tripTarget(t);
  if(tg && tg>new Date()) return `<div class="sec" style="text-align:center">✈️ Indulásig</div><div class="cd" data-cd="${tg.toISOString()}" data-mode="big">${cdRender(tg,'big')}</div>`;
  const days=tripDays(t), ix=days.indexOf(todayStr());
  return ix>=0 ? `<div class="banner">🌴 Nyaralás: ${ix+1}. nap / ${days.length}</div>` : '';
}
function tick(){
  let passed=false;
  document.querySelectorAll('[data-cd]').forEach(el=>{ const x=cdRender(new Date(el.dataset.cd),el.dataset.mode); if(!x) passed=true; el.innerHTML=x; });
  if(passed && !$('sheet').classList.contains('open')) safeRender();
}

/* ===== Fájlok (beszállókártyák) ===== */
const IDB={
  db:null,
  open(){ return this.db || (this.db=new Promise((res,rej)=>{ const r=indexedDB.open('utazasaink',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); },
  async get(k){ try{ const db=await this.open(); return await new Promise(res=>{ const q=db.transaction('files').objectStore('files').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); }); }catch(e){ return undefined; } },
  async set(k,v){ try{ const db=await this.open(); await new Promise(res=>{ const tx=db.transaction('files','readwrite'); tx.objectStore('files').put(v,k); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }
};
const MEM={}, PEND={};
function getImg(id){
  if(MEM[id]) return Promise.resolve(MEM[id]);
  if(PEND[id]) return PEND[id];
  return PEND[id]=(async()=>{
    let u=await IDB.get(id);
    if(!u){ try{ const r=await api('file',{id}); if(r.ok){ u=`data:${r.mime||'image/jpeg'};base64,${r.data}`; IDB.set(id,u); } }catch(e){} }
    if(u) MEM[id]=u;
    delete PEND[id];
    return u;
  })();
}
function hydrate(root){
  (root||document).querySelectorAll('img[data-fid]').forEach(async el=>{
    if(el.getAttribute('src')) return;
    const u=await getImg(el.dataset.fid);
    if(u) el.src=u; else el.alt='Nem elérhető (nincs net)';
  });
}
async function prefetchDocs(){
  const ids=[...new Set(S.items.filter(i=>i.type==='docs').flatMap(i=>i.files||[]))];
  for(const id of ids){ if(!MEM[id]) await getImg(id); }
}
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
function toJpeg(src,w,h){
  const s=Math.min(1,2000/Math.max(w,h)), c=document.createElement('canvas');
  c.width=Math.round(w*s); c.height=Math.round(h*s);
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.88);
}
async function loadPdfJs(){
  if(window.pdfjsLib) return;
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
async function fileToImages(file){
  if(file.type==='application/pdf' || /\.pdf$/i.test(file.name)){
    await loadPdfJs();
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise, out=[];
    for(let n=1; n<=Math.min(pdf.numPages,6); n++){
      const page=await pdf.getPage(n), v1=page.getViewport({scale:1});
      const vp=page.getViewport({scale:Math.min(3,2000/Math.max(v1.width,v1.height))});
      const c=document.createElement('canvas'); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
      await page.render({canvasContext:x,viewport:vp}).promise;
      out.push(c.toDataURL('image/jpeg',0.9));
    }
    return out;
  }
  const url=URL.createObjectURL(file);
  try{ const img=await loadImg(url); return [toJpeg(img,img.naturalWidth,img.naturalHeight)]; }
  finally{ URL.revokeObjectURL(url); }
}
function renderFilesBox(){
  const b=$('filesbox'); if(!b||!FORM) return;
  b.innerHTML=`<div class="thumbs">${FORM.files.map((id,i)=>`<div class="th"><img data-fid="${id}" alt=""><button type="button" class="x" onclick="rmFile(0,${i})">✕</button></div>`).join('')}${FORM.newFiles.map((u,i)=>`<div class="th"><img src="${u}" alt=""><button type="button" class="x" onclick="rmFile(1,${i})">✕</button></div>`).join('')}</div>
    <label class="upbtn">📎 Kép vagy PDF hozzáadása<input type="file" accept="image/*,application/pdf" multiple style="display:none" onchange="addFiles(this)"></label><div id="fstat" class="meta"></div>`;
  hydrate(b);
}
function rmFile(kind,i){ if(!FORM) return; (kind?FORM.newFiles:FORM.files).splice(i,1); renderFilesBox(); }
async function addFiles(inp){
  const FM=FORM, files=[...inp.files]; if(!FM||!files.length) return;
  $('fstat').textContent='Feldolgozás...';
  for(const f of files){
    try{ const imgs=await fileToImages(f); FM.newFiles.push(...imgs); }
    catch(e){ toast('Nem sikerült beolvasni: '+f.name); }
  }
  if(FORM===FM) renderFilesBox();
}

/* ===== Szerver ===== */
async function api(action, payload={}){
  if(API_URL.startsWith('IDE_')) throw new Error('nincs URL');
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({action, code:S.code}, payload))});
  return r.json();
}
function applyOp(items, op){
  if(op.a==='delete') return items.filter(i=>i.id!==op.id);
  const list = op.a==='save' ? [op.item] : op.items;
  items = items.slice();
  list.forEach(it=>{ const ix=items.findIndex(i=>i.id===it.id); if(ix>=0) items[ix]=Object.assign({},items[ix],it); else items.push(it); });
  return items;
}
function queue(op){ S.items=applyOp(S.items,op); S.queue.push(op); persist(); render(); flush(); }
async function flush(){
  if(flushing) return; flushing=true;
  try{
    while(S.queue.length){
      const op=S.queue[0];
      const p = op.a==='delete' ? {id:op.id} : op.a==='save' ? {item:op.item} : {items:op.items};
      const r = await api(op.a, p);
      if(r.auth===false){ logout(true); break; }
      if(!r.ok){ toast('Szerverhiba, a mentés a telefonon vár: '+(r.error||'ismeretlen')); break; }
      S.queue.shift(); persist(); setSync();
    }
  }catch(e){ /* nincs net – később újrapróbálja */ }
  finally{ flushing=false; setSync(); }
}
async function load(silent){
  if(!S.code || S.loading) return;
  S.loading=true; if(!silent) setSync('frissítés...');
  try{
    await flush();
    const r = await api('list');
    if(r.auth===false){ logout(true); return; }
    if(r.ok && !r.items.length && S.items.length && !S.queue.length){
      // A szerver üres, de a telefonon vannak adatok (pl. korábbi szerverhiba miatt) → feltöltjük őket
      S.queue.push({a:'saveMany',items:S.items.slice()}); persist();
      await flush();
      return;
    }
    if(r.ok){ let items=r.items; S.queue.forEach(op=>{ items=applyOp(items,op); }); S.items=items; persist(); prefetchDocs(); }
  }catch(e){ if(!silent) toast('Nincs kapcsolat – a telefonon tárolt adatokat látod'); }
  finally{ S.loading=false; safeRender(); }
}
function setSync(t){ const el=$('sync'); if(!el) return; el.textContent = t ? ' · '+t : (S.queue.length ? ` · ⏳ ${S.queue.length} mentésre vár` : ''); }

/* ===== Belépés ===== */
async function doLogin(){
  const code=$('pw').value.trim().toUpperCase(); if(!code) return;
  const b=$('lbtn'); b.disabled=true; b.textContent='Belépés...';
  try{
    const r=await api('login',{code});
    if(r.ok){ S.code=code; S.user=r.user; persist(); render(); load(); return; }
    toast(r.error||'Hibás jelszó');
  }catch(e){ toast(API_URL.startsWith('IDE_') ? 'Még nincs beállítva az API_URL a fájlban!' : 'Nincs kapcsolat'); }
  b.disabled=false; b.textContent='Belépés';
}
function logout(force){
  if(!force && !confirm('Kijelentkezel?')) return;
  S={code:'',user:'',items:[],queue:[],trip:null,tab:'plan',loading:false}; persist(); render();
  if(force) toast('Lejárt a belépés, lépj be újra');
}

/* ===== Nézetek ===== */
function safeRender(){ const a=document.activeElement; if(a && a.id==='qp' && a.value) return; render(); }
function render(){
  const app=$('app');
  if(!S.code){ app.innerHTML=loginHTML(); return; }
  const trip=S.items.find(i=>i.type==='trip' && i.id===S.trip);
  if(!trip){ S.trip=null; app.innerHTML=tripsHTML(); }
  else app.innerHTML=tripHTML(trip);
  setSync();
  hydrate();
}
function loginHTML(){
  return `<div class="login"><div style="font-size:56px">✈️</div><h1>Utazásaink</h1><div class="meta">Gábor & Réka</div>
  <form onsubmit="event.preventDefault();doLogin()"><input id="pw" type="password" placeholder="Jelszó" autocomplete="current-password" autocapitalize="characters">
  <button id="lbtn" class="btn p" style="width:100%;margin-top:12px">Belépés</button></form></div>`;
}
function tripsHTML(){
  const today=todayStr();
  const trips=S.items.filter(i=>i.type==='trip').sort((a,b)=>(b.from||'').localeCompare(a.from||''));
  let h=`<header><h1>✈️ Utazásaink<div class="sub">Szia ${esc(S.user)}!<span id="sync" class="sync"></span></div></h1>
    <button class="ib" onclick="load()">⟳</button><button class="ib" onclick="logout()">⏻</button></header><main>`;
  if(!trips.length) h+=empty('Még nincs utazás.<br>Nyomd meg a <b>+</b> gombot és vedd fel az elsőt!');
  trips.forEach(t=>{
    const now = t.from && t.to && t.from<=today && today<=t.to;
    const past = t.to && t.to<today;
    const n=S.items.filter(i=>i.trip===t.id).length;
    h+=`<div class="card ${now?'today':''}" onclick="openTrip('${t.id}')" style="${past?'opacity:.75':''}">
      <div class="row"><div style="flex:1;min-width:0"><h3>${esc(t.name)}</h3>
      <div class="meta">${esc(t.place||'')}${t.place&&t.from?' · ':''}${range(t.from,t.to)}</div></div>
      ${now?'<span class="chip g">MOST</span>':''}</div>${(()=>{ const tg=tripTarget(t); return tg&&tg>new Date() ? `<div class="cdline" data-cd="${tg.toISOString()}" data-mode="line">${cdRender(tg,'line')}</div>` : ''; })()}<div class="meta" style="margin-top:6px">${n} bejegyzés</div></div>`;
  });
  return h+`</main><button class="fab" onclick="openForm('trip')">+</button>`;
}
function tripHTML(t){
  const items=S.items.filter(i=>i.trip===t.id && i.type===S.tab);
  return `<header><button class="ib" onclick="closeTrip()">←</button>
    <h1>${esc(t.name)}<div class="sub">${range(t.from,t.to)}<span id="sync" class="sync"></span></div></h1>
    <button class="ib" onclick="load()">⟳</button><button class="ib" onclick="editItem('${t.id}')">✏️</button></header>

}

const byDate=(a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.title||'').localeCompare(b.title||'','hu');
function ckCard(i,t){
  const meta=[i.address?'📍 '+esc(addrTxt(i.address)):'', i.date?'🗓️ '+fd(i.date):''].filter(Boolean).join(' · ');
  const r=Number(i.rating)||0;
  return `<div class="card ${i.done?'done':''}" onclick="editItem('${i.id}')">
    <div class="row"><button class="chk ${i.done?'on':''}" onclick="event.stopPropagation();toggle('${i.id}')">✓</button>
    <div style="flex:1;min-width:0"><h3>${esc(i.title)}</h3>${meta?`<div class="meta">${meta}</div>`:''}</div>${who(i.author)}</div>
    ${r?`<div class="stars-s">${'★'.repeat(r)}<span>${'★'.repeat(5-r)}</span></div>`:''}${noteH(i)}${actsH(i.address,t)}</div>`;
}
function checkList(items,t,doneLabel,emptyTxt){
  if(!items.length) return empty(emptyTxt);
  const todo=items.filter(i=>!i.done).sort(byDate), done=items.filter(i=>i.done).sort(byDate);
  let h='';
  if(todo.length) h+=`<div class="sec">Tervben (${todo.length})</div>`+todo.map(i=>ckCard(i,t)).join('');
  if(done.length) h+=`<div class="sec">${doneLabel} (${done.length})</div>`+done.map(i=>ckCard(i,t)).join('');
  return h;
}

/* ===== Műveletek ===== */
function openTrip(id){ S.trip=id; persist(); render(); scrollTo(0,0); }
function closeTrip(){ S.trip=null; persist(); render(); scrollTo(0,0); }
function setTab(k){ S.tab=k; persist(); render(); scrollTo(0,0); }
function editItem(id){ const it=S.items.find(i=>i.id===id); if(it) openForm(it.type,it); }
function toggle(id){ const it=S.items.find(i=>i.id===id); if(it) queue({a:'save',item:Object.assign({},it,{done:!it.done})}); }
function copyCode(id){
  const s=S.items.find(i=>i.id===id); if(!s) return;
  if(navigator.clipboard) navigator.clipboard.writeText(s.code).then(()=>toast('Kód kimásolva: '+s.code),()=>toast(s.code));
  else toast(s.code);
}
function quickPack(){
  const el=$('qp'), v=el.value.trim(); if(!v) return;
  QW=$('qw').value;
  queue({a:'save',item:{id:uid(),trip:S.trip,type:'pack',title:v,who:QW,done:false,author:S.user,created:nowIso()}});
  setTimeout(()=>{ const q=$('qp'); if(q) q.focus(); },30);
}
function copyPack(){
  const src=S.items.filter(i=>i.type==='trip' && i.id!==S.trip && S.items.some(p=>p.trip===i.id && p.type==='pack'));
  if(!src.length){ toast('Még nincs korábbi pakolólista'); return; }
  openSheet(`<h2>Pakolólista másolása</h2><div class="meta">Melyik utazás listáját hozzam át? (A már meglévő tételek nem duplázódnak.)</div>
    ${src.map(s=>`<button class="btn" style="width:100%;margin-top:10px;text-align:left" onclick="doCopyPack('${s.id}')">${esc(s.name)} <span class="meta">· ${S.items.filter(p=>p.trip===s.id&&p.type==='pack').length} tétel</span></button>`).join('')}
    <div class="btns"><button class="btn" onclick="closeSheet()">Mégse</button></div>`);
}
function doCopyPack(from){
  const have=new Set(S.items.filter(i=>i.trip===S.trip && i.type==='pack').map(i=>(i.title||'').toLowerCase()));
  const items=S.items.filter(i=>i.trip===from && i.type==='pack' && !have.has((i.title||'').toLowerCase()))
    .map(i=>({id:uid(),trip:S.trip,type:'pack',title:i.title,who:i.who||'Közös',done:false,author:S.user,created:nowIso()}));
  closeSheet();
  if(!items.length){ toast('Minden tétel megvan már'); return; }
  queue({a:'saveMany',items}); toast(items.length+' tétel átmásolva');
}
function resetPack(){
  if(!confirm('Minden pipát leveszel a pakolólistáról?')) return;
  const items=S.items.filter(i=>i.trip===S.trip && i.type==='pack' && i.done).map(i=>Object.assign({},i,{done:false}));
  queue({a:'saveMany',items});
}

/* ===== Űrlap ===== */
function openSheet(h){ $('panel').innerHTML=h; $('sheet').classList.add('open'); $('panel').scrollTop=0; }
function closeSheet(){ $('sheet').classList.remove('open'); FORM=null; }
function openForm(type,item){
  const isNew=!item, t=S.items.find(i=>i.id===S.trip);
  const it=item ? Object.assign({},item) : {type, trip: type==='trip' ? '' : S.trip};
  if(isNew && type==='plan') it.date=defDate(t);
  if(isNew && type==='pack') it.who=QW;
  FORM={it,isNew,files:(it.files||[]).slice(),newFiles:[],busy:false};
  let h=`<h2>${isNew ? 'Új '+TITLES[type] : cap(TITLES[type])+' szerkesztése'}</h2>`;
  if(!isNew && it.author) h+=`<div class="meta">Felvette: ${esc(it.author)}</div>`;
  F[type].forEach(f=>{
    const v=it[f.k] ?? '';
    if(f.t==='check') h+=`<label class="sw"><input type="checkbox" id="f_${f.k}" ${v?'checked':''}> ${f.l}</label>`;
    else if(f.t==='rating') h+=`<label>${f.l}</label><div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button type="button" class="${n<=(Number(v)||0)?'on':''}" onclick="setStar(${n})">★</button>`).join('')}</div><input type="hidden" id="f_${f.k}" value="${Number(v)||0}">`;
    else if(f.t==='select') h+=`<label>${f.l}</label><select id="f_${f.k}">${f.o.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
    else if(f.t==='day'){
      const days=tripDays(t);
      if(days.length){
        let opts=f.req?'':`<option value="" ${!v?'selected':''}>— Nincs tervezett nap —</option>`;
        if(v && days.indexOf(v)<0) opts+=`<option value="${esc(v)}" selected>${fd(v)}</option>`;
        opts+=days.map((d,i)=>`<option value="${d}" ${d===v?'selected':''}>${i+1}. nap · ${fd(d)}</option>`).join('');
        h+=`<label>${f.l}${f.req?' *':''}</label><select id="f_${f.k}">${opts}</select>`;
      } else {
        h+=`<label>${f.l}${f.req?' *':''}</label><div class="quick"><input type="date" id="f_${f.k}" value="${esc(v)}">${f.req?'':clearBtn('f_'+f.k)}</div>`;
      }
    }
    else if(f.t==='time') h+=`<label>${f.l}</label><div class="quick"><input type="time" id="f_${f.k}" value="${esc(v)}">${clearBtn('f_'+f.k)}</div>`;
    else if(f.t==='files') h+=`<label>${f.l}</label><div id="filesbox"></div>`;
    else if(f.t==='area') h+=`<label>${f.l}</label><textarea id="f_${f.k}">${esc(v)}</textarea>`;
    else h+=`<label>${f.l}${f.req?' *':''}</label><input type="${f.t}" id="f_${f.k}" value="${esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
  });
  h+=`<div class="btns">${isNew?'':`<button class="btn d" onclick="delItem()">🗑</button>`}<button class="btn" onclick="closeSheet()">Mégse</button><button class="btn p" id="savebtn" onclick="saveForm()">Mentés</button></div>`;
  openSheet(h);
  renderFilesBox();
}
function setStar(n){
  const inp=$('f_rating'); const v = Number(inp.value)===n ? 0 : n; inp.value=v;
  [...$('stars').children].forEach((b,i)=>b.classList.toggle('on', i<v));
}
async function saveForm(){
  const FM=FORM; if(!FM||FM.busy) return;
  const {it,isNew}=FM, o=Object.assign({},it);
  for(const f of F[it.type]){
    if(f.t==='files') continue;
    const el=$('f_'+f.k);
    const v = f.t==='check' ? el.checked : f.t==='rating' ? Number(el.value) : el.value.trim();
    if(f.req && !v){ toast('Kötelező: '+f.l); el.focus(); return; }
    o[f.k]=v;
  }
  if(F[it.type].some(f=>f.t==='files')){
    if(FM.newFiles.length){
      const btn=$('savebtn'); FM.busy=true; btn.disabled=true;
      try{
        while(FM.newFiles.length){
          btn.textContent=`Feltöltés... (${FM.newFiles.length})`;
          const u=FM.newFiles[0];
          const r=await api('upload',{data:u.split(',')[1],mime:'image/jpeg',name:(o.title||'jegy')+'.jpg'});
          if(!r.ok) throw new Error(r.error||'szerverhiba');
          MEM[r.id]=u; IDB.set(r.id,u);
          FM.files.push(r.id); FM.newFiles.shift();
        }
      }catch(e){
        FM.busy=false; toast('Feltöltés sikertelen – van internet? '+(e.message||''));
        if(FORM===FM){ btn.disabled=false; btn.textContent='Mentés'; renderFilesBox(); }
        return;
      }
      FM.busy=false;
    }
    o.files=FM.files.slice();
  }
  if(isNew){ o.id=uid(); o.author=S.user; o.created=nowIso(); }
  closeSheet();
  if(isNew && o.type==='trip'){ S.trip=o.id; S.tab='stay'; }
  queue({a:'save',item:o});
}
function delItem(){
  if(!FORM) return;
  const it=FORM.it;
  if(!confirm(it.type==='trip' ? 'Biztosan törlöd az egész utazást?' : 'Biztosan törlöd?')) return;
  closeSheet();
  if(it.type==='trip') S.trip=null;
  queue({a:'delete',id:it.id});
}

/* ===== Indulás ===== */
render();
if(S.code) load(true);
setInterval(()=>{ if(S.code && !document.hidden && !$('sheet').classList.contains('open')) load(true); }, 60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S.code) load(true); });
setInterval(tick,30000);
window.addEventListener('online',()=>{ if(S.code) load(true); });
</script>
